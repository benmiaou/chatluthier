# Project identification
sonar.projectKey=Chatluthier
sonar.projectName=Chatluthier
sonar.projectVersion=1.0.0

# Source files to analyze - Include all TypeScript and JavaScript files
sonar.sources=src
sonar.tests=tests

# Language settings for TypeScript/JSX
sonar.language=ts
sonar.typescript.tsconfigPath=tsconfig.json
sonar.typescript.include=**/*.ts,**/*.tsx

# Include TypeScript files explicitly
sonar.inclusions=**/*.ts,**/*.tsx,**/*.js,**/*.jsx

# Coverage settings
sonar.javascript.lcov.reportPaths=coverage/lcov.info
sonar.typescript.lcov.reportPaths=coverage/lcov.info

# Exclusions - Don't analyze these directories
sonar.exclusions=node_modules/**,dist/**,coverage/**,.git/**,.github/**,.husky/**,.vscode/**,.sonarlint/**,**/*.config.*,**/*.md,scripts/**

# Test files inclusion
sonar.test.inclusions=tests/**/*.test.ts,tests/**/*.test.tsx,tests/**/*.test.js,tests/**/*.spec.ts,tests/**/*.spec.tsx

# Source file encoding
sonar.sourceEncoding=UTF-8

# TypeScript specific settings
sonar.typescript.version=5.0
sonar.nodejs.version=20

# React specific - Enable React rules
sonar.typescript.react.version=18

# Enable TypeScript analysis explicitly
sonar.typescript.enable=true

# Enable JSX analysis
sonar.jsx.enable=true

# Enable security analysis for TypeScript
sonar.typescript.security.hotspot.review.enabled=true

# Force analysis of all files
sonar.verbose=true

# Enable security analysis
sonar.security.hotspot.review.enabled=true

# Quality profiles
sonar.profile=SonarWay

# Enable additional plugins if available
sonar.eslint.reportPaths=.
