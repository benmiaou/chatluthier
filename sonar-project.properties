# Project identification
sonar.projectKey=Chatluthier
sonar.projectName=Chatluthier
sonar.projectVersion=1.0.0
sonar.projectBaseDir=.

# Source files to analyze
sonar.sources=src,srv
sonar.tests=tests

# Coverage settings
sonar.javascript.lcov.reportPaths=coverage/lcov.info
sonar.typescript.lcov.reportPaths=coverage/lcov.info

# Exclusions
sonar.exclusions=node_modules/**,dist/**,coverage/**,.git/**,.github/**,.husky/**,.vscode/**,.sonarlint/**
sonar.test.inclusions=tests/**/*.test.js,tests/**/*.test.ts,tests/**/*.test.tsx

# Encoding
sonar.sourceEncoding=UTF-8

# Force TypeScript analysis
sonar.language=ts
sonar.nodejs.version=20