name: CI/CD Pipeline

on:
  push:
    branches:
      - dev
      - main
  pull_request:
    branches:
      - dev
      - main
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-test-sonar:
    name: Build, Lint, Test & SonarQube
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'npm'

      - name: Install dependencies
        run: npm install

      - name: Run ESLint
        run: npm run lint

      - name: Run Prettier check
        run: npm run check-format

      - name: Build project
        run: npm run build

      - name: Run tests with coverage
        run: npm run test:jest -- --coverage

      - name: Run SonarQube analysis
        uses: SonarSource/sonarqube-scan-action@v8.2.0
        with:
          args: >-
            -Dsonar.projectBaseDir=.
            -Dsonar.sources=src,srv
            -Dsonar.tests=tests
            -Dsonar.language=ts
            -Dsonar.nodejs.version=20
            -Dsonar.javascript.lcov.reportPaths=coverage/lcov.info
            -Dsonar.typescript.lcov.reportPaths=coverage/lcov.info
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          SONAR_HOST_URL: ${{ secrets.SONAR_HOST_URL }}

  deploy:
    name: Deploy to Server
    needs: build-test-sonar
    runs-on: ubuntu-latest
    if: github.event_name == 'push' && (github.ref == 'refs/heads/dev' || github.ref == 'refs/heads/main')

    steps:
      - name: Deploy to DEV server
        if: github.ref == 'refs/heads/dev'
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.DEV_SERVER_IP }}
          username: ${{ secrets.DEV_SERVER_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          port: 22
          script: |
            cd ${{ secrets.DEV_PROJECT_PATH }}
            npm run db:backup || true
            npm run assets:backup || true
            git fetch --all
            git reset --hard origin/dev
            npm install --build-from-source=sqlite3
            npm run build
            pm2 restart chatluthier-dev

      - name: Deploy to PROD server
        if: github.ref == 'refs/heads/main'
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.PROD_SERVER_IP }}
          username: ${{ secrets.PROD_SERVER_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          port: 22
          script: |
            cd ${{ secrets.PROD_PROJECT_PATH }}
            npm run db:backup || true
            npm run assets:backup || true
            git fetch --all
            git reset --hard origin/main
            npm install --build-from-source=sqlite3
            npm run build
            pm2 restart chatluthier
